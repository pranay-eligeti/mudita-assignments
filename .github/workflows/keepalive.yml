# Secondary keep-alive (GitHub cron is best-effort and can lag). Primary: a free UptimeRobot/cron-job.org monitor on /healthz every 5 min.
# Set the repo variable APP_URL (Settings > Secrets and variables > Actions > Variables), e.g. https://mudita-assignments.onrender.com
name: keepalive
on:
  schedule: [{cron: "*/10 * * * *"}]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.APP_URL != '' }}
    steps:
      - run: curl -fsS --max-time 90 --retry 3 --retry-delay 20 "${{ vars.APP_URL }}/healthz"
